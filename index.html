<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kauppalista</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kauppalista">
  <link rel="apple-touch-icon" href="icon.png">
</head>
<body>

  <div id="login-view" style="display:none">
    <h1>✱ SATAMA ✱</h1>
    <hr class="divider" style="width:100%">
    <button class="login-btn" id="login-btn">Kirjaudu Googlella</button>
  </div>

  <div class="container" id="home-view" style="display:none">
    <h1>✱ SATAMA ✱</h1>
    <hr class="divider">

    <div class="place-link" id="laituri-link">
      <span class="prefix">›</span>
      <span class="place-link-label">Laituri</span>
      <span class="place-link-badge" id="laituri-badge" style="display:none"></span>
    </div>

    <hr class="divider">

    <ul class="list" id="home-list"></ul>

    <hr class="divider">

    <div class="add-item">
      <span class="prefix">›</span>
      <input type="text" id="new-list-input" placeholder="uusi lista...">
      <button id="new-list-btn">+</button>
    </div>

    <button id="signout-link">kirjaudu ulos</button>
  </div>

  <div class="container" id="laituri-view" style="display:none">
    <div class="list-header">
      <button class="back-btn" id="laituri-back-btn">‹</button>
      <h1>✱ LAITURI ✱</h1>
      <span></span>
    </div>

    <div class="add-item">
      <span class="prefix">›</span>
      <input type="text" id="laituri-input" placeholder="uusi ajatus...">
      <button id="laituri-add-btn">+</button>
    </div>

    <div class="add-item">
      <span class="prefix">⌕</span>
      <input type="text" id="laituri-search" placeholder="hae...">
    </div>

    <hr class="divider">

    <ul class="list" id="laituri-list"></ul>
  </div>

  <div class="container" id="app-view" style="display:none">
    <div class="list-header">
      <button class="back-btn" id="back-btn">‹</button>
      <h1 id="list-title">✱ kauppalista ✱</h1>
      <button class="settings-btn" id="settings-btn">🔒</button>
    </div>
    <div class="subtitle" id="subtitle">ladataan...</div>

    <hr class="divider">

    <div class="add-item">
      <span class="prefix">›</span>
      <input type="text" placeholder="lisää tuote...">
      <button>+</button>
    </div>

    <ul class="list"></ul>

    <hr class="divider" id="footer-divider" style="display:none">
    <div class="list-footer" id="list-footer" style="display:none">
      <div class="footer-row">
        <div class="count" id="footer-count"></div>
        <button class="eye-btn" id="eye-btn" style="display:none"></button>
      </div>
    </div>
  </div>

  <div class="dialog-overlay" id="dialog-overlay" style="display:none">
    <div class="dialog-box">
      <p class="dialog-title" id="dialog-title"></p>
      <p class="dialog-body" id="dialog-body" style="display:none"></p>
      <div class="dialog-buttons">
        <button class="dialog-btn dialog-btn-cancel" id="dialog-cancel">Peru</button>
        <button class="dialog-btn dialog-btn-danger" id="dialog-confirm">Poista lista</button>
      </div>
    </div>
  </div>

  <div class="dialog-overlay" id="settings-overlay" style="display:none">
    <div class="dialog-box">
      <p class="dialog-title">Listan asetukset</p>
      <div class="settings-row">
        <span id="settings-visibility-label">Näkyy vain sinulle</span>
        <label class="toggle">
          <input type="checkbox" id="visibility-toggle">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="dialog-buttons">
        <button class="dialog-btn dialog-btn-cancel" id="settings-close">Sulje</button>
      </div>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');

      // Kun uusi service worker ottaa ohjat (uusi versio deployattu), ladataan
      // sivu automaattisesti kerran uudelleen sen sijaan että käyttäjän
      // pitäisi sulkea ja avata PWA moneen kertaan nähdäkseen päivityksen.
      let paivitysLadattu = false;
      navigator.serviceWorker.addEventListener('controllerchange', function() {
        if (paivitysLadattu) return;
        paivitysLadattu = true;
        window.location.reload();
      });
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
</body>
</html>
